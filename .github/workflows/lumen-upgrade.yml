name: Lumen Upgrade

# Tells the private LedgerHQ/lumen-automation repo that Lumen was released
# (ADR 027). The upgrade runs live there: this repo is public, so it cannot use
# the internal Cairn action. Run the upgrade by hand from that repo to test it.

concurrency:
  group: lumen-upgrade
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ['Release All']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify lumen-automation
    # Only a real release from main starts upgrades: not a failed one, a dry
    # run (nothing published) or one run from another branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.display_title, '(dry-run)'))
    runs-on: public-ledgerhq-shared-small
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.LUMEN_RELEASE_APP_ID }}
          private-key: ${{ secrets.LUMEN_RELEASE_APP_KEY }}
          owner: LedgerHQ
          repositories: lumen-automation
          permission-contents: write # required to send a repository_dispatch

      - name: Send lumen-released
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/LedgerHQ/lumen-automation/dispatches -f event_type=lumen-released
