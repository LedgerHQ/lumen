name: Pull Request Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read # Required for reading workflow runs and status checks
  contents: read
  id-token: write # Required for SonarCloud OIDC authentication

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true

jobs:
  version-plan-check:
    name: Version Plan Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check that affected publishable libs have a version plan
        run: npx nx release plan:check --base=origin/main --verbose

  agent-drift:
    name: Agent docs & structure drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Zero-dependency Node script (AGENTS.md ↔ .claude/skills ↔ codebase);
      # no npm install or Nx needed, so keep this job lean.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          cache-nx: 'false'
          set-shas: 'false'

      - name: Check agent docs & structure for drift
        run: npm run check:agent-docs

  dependency-alignment:
    name: Dependency alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-nx: 'false'
          set-shas: 'false'

      - name: One version per package across manifests (syncpack)
        run: npm run check:deps

      - name: Peer ranges accept the versions we test with
        run: npm run check:peer-deps

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx run-many --targets=build-deps --all
      - run: npx nx affected -t lint typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx affected -t build

  bundle-checks:
    name: Bundle checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx affected -t test:tree-shaking

      - run: npx nx affected -t test:bundle

      - name: Verify advertised exports ship (publint)
        run: |
          npx nx run-many -t build --projects='libs/*'
          npm run check:package-exports

  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Always run the full suite on main so the SonarCloud baseline
            # never depends on which projects a given merge happened to touch.
            npx nx run-many -t test --all --passWithNoTests --coverage
          else
            npx nx affected -t test --passWithNoTests --coverage
          fi

      - name: Fix lcov paths to be relative to workspace root
        run: node internals/repo-tools/src/ci/fix-lcov-paths/fixLcovPaths.mjs

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: libs/*/test-output/*/coverage/lcov.info
          if-no-files-found: warn

  sonar:
    name: Sonar scan
    needs: unit-testing
    if: ${{ !cancelled() && needs.unit-testing.result == 'success' }}
    uses: ./.github/workflows/scan-sonar-called.yml
    with:
      should_download_coverage: true
      require_coverage: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
