name: Sync Figma Tokens

# Exports the Figma variables, rebuilds every token output, and opens a tokens
# PR. `sync-figma-all.yml` calls it with `open-pull-request: false` and opens
# one combined PR instead.

on:
  workflow_dispatch:
    inputs:
      figma_foundations_file_key:
        description: 'Figma Foundations File Key (use default if empty)'
      open-pull-request:
        description: 'Open a pull request with the result'
        type: boolean
        default: true
  workflow_call:
    inputs:
      figma_foundations_file_key:
        type: string
        required: false
      open-pull-request:
        type: boolean
        default: true
    secrets:
      FIGMA_API_TOKEN:
        required: true

concurrency:
  # `github.workflow` is the caller's name when called, so a standalone run and
  # a run inside `sync-figma-all` don't cancel each other.
  group: ${{ github.workflow }}-tokens
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  tokens:
    name: Export and build tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          set-shas: 'false'

      - name: Export tokens from Figma
        run: npx nx run sync-figma:extract --kind=tokens
        env:
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_FOUNDATIONS_FILE_KEY: ${{ inputs.figma_foundations_file_key || vars.FIGMA_FOUNDATIONS_FILE_KEY }}

      - name: Build token outputs
        run: npx nx run design-build:tokens

      - name: Upload tokens
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: figma-tokens
          path: |
            internals/design-sources/tokens/figma/
            libs/design-core/src/lib/generated/

  pull-request:
    name: Open the tokens pull request
    needs: tokens
    if: ${{ inputs.open-pull-request }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit changes to branch
      pull-requests: write # Required to create and update pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true # required to create the pull request

      - name: Download tokens
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: figma-tokens

      - name: Add release plan
        run: |
          mkdir -p .nx/version-plans
          TIMESTAMP=$(node -e "console.log(Date.now())")
          cat << EOF > .nx/version-plans/version-plan-$TIMESTAMP.md
          ---
          '@ledgerhq/lumen-design-core': patch
          ---

          Sync Figma Design Tokens
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: '💄 (figma): Sync Figma Design Tokens'
          title: '💄 (figma): Sync Figma Design Tokens'
          body: |
            Automatically sync design tokens from Figma:

            - ✅ Export the Figma variables as DTCG
            - ✅ Rebuild every token output
          branch: sync-figma-tokens
