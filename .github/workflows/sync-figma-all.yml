name: Sync Figma (all)

# Runs the tokens and symbols syncs and opens one combined PR. Each sync can
# also run on its own: `sync-figma-tokens.yml`, `sync-figma-symbols.yml`.

concurrency:
  group: sync-figma
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      figma_foundations_file_key:
        description: 'Figma Foundations File Key (use default if empty)'
      figma_symbols_file_key:
        description: 'Figma Symbols File Key (use default if empty)'
      figma_icons_canvas:
        description: 'Figma Icons Canvas (use default if empty)'

permissions:
  contents: read

jobs:
  tokens:
    name: Tokens
    uses: ./.github/workflows/sync-figma-tokens.yml
    # A called workflow can't request more than its caller grants, even for a
    # job it skips (its own pull-request job).
    permissions:
      contents: write
      pull-requests: write
    with:
      figma_foundations_file_key: ${{ inputs.figma_foundations_file_key }}
      open-pull-request: false
    secrets:
      FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}

  symbols:
    name: Symbols
    uses: ./.github/workflows/sync-figma-symbols.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      figma_symbols_file_key: ${{ inputs.figma_symbols_file_key }}
      figma_icons_canvas: ${{ inputs.figma_icons_canvas }}
      open-pull-request: false
    secrets:
      FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}

  create-pull-request:
    name: Create Pull Request
    needs: [tokens, symbols]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit changes to branch
      pull-requests: write # Required to create and update pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true # required to create the pull request

      - name: Download tokens
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: figma-tokens

      - name: Download symbols
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: figma-symbols

      - name: Add release plan
        run: |
          mkdir -p .nx/version-plans
          TIMESTAMP=$(node -e "console.log(Date.now())")
          cat << EOF > .nx/version-plans/version-plan-$TIMESTAMP.md
          ---
          '@ledgerhq/lumen-design-core': patch
          '@ledgerhq/lumen-ui-rnative': patch
          '@ledgerhq/lumen-ui-react': patch
          ---

          Sync Figma Design Tokens & Symbols
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: '💄 (figma): Sync Figma Design Tokens & Symbols'
          title: '💄 (figma): Sync Figma Design Tokens & Symbols'
          body: |
            Automatically sync design tokens and symbol components from Figma:

            - ✅ Export the Figma variables as DTCG and rebuild every token output
            - ✅ Export the icons and generate the React and React Native symbol components
          branch: sync-figma
