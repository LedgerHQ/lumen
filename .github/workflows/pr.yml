name: Pull Request Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read # Required for reading workflow runs and status checks
  contents: read
  id-token: write # Required for SonarCloud OIDC authentication

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true

jobs:
  version-plan-check:
    name: Version Plan Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check that affected publishable libs have a version plan
        run: npx nx release plan:check --base=origin/main --verbose

  agent-drift:
    name: Agent docs & structure drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Zero-dependency Node script (AGENTS.md ↔ .claude/skills ↔ codebase);
      # no npm install or Nx needed, so keep this job lean.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          cache-nx: 'false'
          set-shas: 'false'

      - name: Check agent docs & structure for drift
        run: npm run check:agent-docs

  dependency-alignment:
    name: Dependency alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-nx: 'false'
          set-shas: 'false'

      - name: One version per package across manifests (syncpack)
        run: npm run check:deps

      - name: Peer ranges accept the versions we test with
        run: npm run check:peer-deps

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx run-many --targets=build-deps --all
      - run: npx nx affected -t lint typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx affected -t build

  bundle-checks:
    name: Bundle checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npx nx affected -t test:tree-shaking

      - run: npx nx affected -t test:bundle

      - name: Build publishable libs
        id: build
        run: npx nx run-many -t build --projects='libs/*'

      - name: Verify package exports (publint)
        run: npm run check:package-exports

      # Runs even when publint fails, so one CI run reports both.
      - name: Verify package types (attw)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:package-types

  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Best-effort: without a baseline the report just has no deltas.
      - name: Download main's coverage baseline
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pr.yml \
            --branch main --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name coverage-summary --dir "${RUNNER_TEMP}/coverage-baseline"

      - name: Run unit tests
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Always run the full suite on main so the SonarCloud baseline
            # never depends on which projects a given merge happened to touch.
            npx nx run-many -t test --all --passWithNoTests --coverage
          else
            npx nx affected -t test --passWithNoTests --coverage
          fi

      - name: Fix lcov paths to be relative to workspace root
        run: node internals/repo-tools/src/ci/fix-lcov-paths/fixLcovPaths.ts

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: libs/*/test-output/*/coverage/lcov.info
          if-no-files-found: warn

      - name: Upload coverage summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-summary
          path: |
            libs/*/test-output/*/coverage/coverage-summary.json
            internals/*/test-output/*/coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Build the coverage section of the PR report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          node internals/repo-tools/src/ci/pr-report/coverageSection.ts \
            "${RUNNER_TEMP}/coverage-baseline" "${RUNNER_TEMP}/pr-report/coverage.md"

      - name: Upload the coverage section
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pr-report-coverage
          path: ${{ runner.temp }}/pr-report/coverage.md

  # Adding a report section: see "PR report" in internals/repo-tools/README.md.
  pr-report:
    name: PR report
    needs: [unit-testing]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Post and update the report comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          install: 'false'
          cache-nx: 'false'
          set-shas: 'false'

      - name: Download report sections
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pr-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/pr-report

      - name: Post the PR report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node internals/repo-tools/src/ci/pr-report/postPrReport.ts "${RUNNER_TEMP}/pr-report"

  # The workspace develops against RN 0.86, but Ledger Wallet Mobile still ships
  # RN 0.81. Re-run ui-rnative typecheck and tests on LWM's stack so code that
  # only works on the newer versions can't land unnoticed. Remove this job (and
  # the preset fallback in libs/ui-rnative/jest.config.ts) once LWM is on RN 0.86
  # (LIVE-39331).
  rn-081-compat:
    name: RN 0.81 compatibility (ui-rnative)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-nx: 'false'
          set-shas: 'false'

      - name: Install Ledger Wallet Mobile's RN 0.81 stack
        run: |
          node internals/repo-tools/src/ci/rn-081-compat/pinRn081Stack.ts
          npm install --legacy-peer-deps --no-audit --no-fund

      - run: npx nx run @ledgerhq/lumen-ui-rnative:typecheck --skip-nx-cache
      - run: npx nx run @ledgerhq/lumen-ui-rnative:test --skip-nx-cache

  sonar:
    name: Sonar scan
    needs: unit-testing
    if: ${{ !cancelled() && needs.unit-testing.result == 'success' }}
    uses: ./.github/workflows/scan-sonar-called.yml
    with:
      should_download_coverage: true
      require_coverage: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
